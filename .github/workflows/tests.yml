name: Tests

on: [push, pull_request]

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [prefer-stable]
        include:
          - php: '8.3'
            dependencies: prefer-lowest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction --no-progress
      - run: composer test
